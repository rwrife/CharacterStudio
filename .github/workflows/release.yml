name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check native target and release version
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            assert.equal(process.platform, process.env.TARGET_PLATFORM);
            assert.equal(process.arch, process.env.TARGET_ARCH);
            if (process.env.GITHUB_REF.startsWith("refs/tags/")) {
              const { version } = JSON.parse(readFileSync("package.json", "utf8"));
              assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, "Release tag must match package.json version");
            }
          '
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Linux Blender libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6
      - name: Install checksum-verified native Blender
        run: npm run setup:blender
      - name: Verify skinning recovery and skinned exports
        run: npm run test:rigging
      - name: Package app and verify bundled files
        run: npm run package:app -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
      - name: Archive Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'CharacterStudio-${{ matrix.platform }}-${{ matrix.arch }}'
          Compress-Archive -LiteralPath "release\$name" -DestinationPath "release\$name.zip"
      - name: Archive macOS app preserving permissions
        if: runner.os == 'macOS'
        run: |
          name="CharacterStudio-${{ matrix.platform }}-${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent "release/$name/CharacterStudio.app" "release/$name.zip"
      - name: Archive Linux portable app preserving permissions
        if: runner.os == 'Linux'
        run: |
          name="CharacterStudio-${{ matrix.platform }}-${{ matrix.arch }}"
          tar -czf "release/$name.tar.gz" -C release "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: CharacterStudio-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CharacterStudio-*
          path: release
          merge-multiple: true
      - name: Verify complete release and generate checksums
        shell: bash
        run: |
          cd release
          for file in CharacterStudio-win32-x64.zip CharacterStudio-win32-arm64.zip \
            CharacterStudio-linux-x64.tar.gz CharacterStudio-darwin-arm64.zip; do
            test -s "$file"
          done
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --draft "${prerelease[@]}" \
            --title "Character Studio $RELEASE_TAG" \
            --notes "Portable applications include native Blender, but not ComfyUI or model weights. Windows and macOS apps are unsigned; macOS apps are not notarized. Linux and macOS full character-generation workflows remain experimental and unverified. See the README for setup and limitations."
          gh release edit "$RELEASE_TAG" --draft=false
